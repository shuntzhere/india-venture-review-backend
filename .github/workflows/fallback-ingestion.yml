name: Backup daily ingestion
on:
  pull_request:
    paths:
      - '.github/workflows/fallback-ingestion.yml'
      - 'api/run.py'
      - 'scraper/**'
      - 'scripts/fallback_ingestion.py'
      - 'tests/**'
      - 'requirements*.txt'
  schedule:
    - cron: '17 8,10,14 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: Read history without scraping or writing data
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ivr-backup-ingestion
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-fallback.lock.txt
      - run: python -m unittest discover -s tests
  fallback:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: ivr-ingestion-backup
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-fallback.lock.txt
      - name: Check and run independent backup
        # Script kills its process group at 240s; CI is the second guard at 300s.
        timeout-minutes: 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            python scripts/fallback_ingestion.py --check-only
          else
            python scripts/fallback_ingestion.py
          fi
